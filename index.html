<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة حسابات العملاء</title>
  <script>
    /* ضبط الوضع (فاتح/ليلي) مبكراً لتجنّب وميض الشاشة */
    (function () {
      try {
        var t = localStorage.getItem("app_theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ===================== شاشة تسجيل الدخول ===================== -->
  <section id="login-screen" class="login-screen">
    <button id="login-theme-toggle" class="theme-toggle login-theme-toggle" aria-label="تبديل الوضع الليلي"></button>
    <div class="login-card">
      <div class="login-logo">حـ</div>
      <h1>نظام إدارة حسابات العملاء</h1>
      <p class="login-sub">الرجاء تسجيل الدخول للمتابعة</p>

      <form id="login-form" autocomplete="off">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" placeholder="اسم المستخدم" required />

        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="كلمة المرور" required />

        <button type="submit" class="btn btn-primary btn-block">دخول</button>
        <p id="login-error" class="login-error"></p>
      </form>

      <div class="login-hint">
        <span>حسابات تجريبية:</span>
        <div>موظف: <b>موظف</b> / <b>1234</b></div>
        <div>مدير: <b>مدير</b> / <b>1234</b></div>
      </div>
    </div>
  </section>

  <!-- ===================== التطبيق ===================== -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-right">
        <div class="brand">نظام إدارة حسابات العملاء</div>
      </div>
      <div class="topbar-left">
        <span id="current-user" class="current-user"></span>
        <button id="theme-toggle" class="theme-toggle" aria-label="تبديل الوضع الليلي"></button>
        <button id="logout-btn" class="btn btn-ghost">تسجيل الخروج</button>
      </div>
    </header>

    <!-- ===================== واجهة الموظف ===================== -->
    <main id="employee-view" class="view hidden">
      <div class="container">
        <h2 class="page-title">البحث عن عميل</h2>

        <div class="search-bar">
          <input type="text" id="employee-search" placeholder="اكتب اسم العميل ثم اضغط بحث..." />
          <button id="employee-search-btn" class="btn btn-primary">بحث</button>
        </div>

        <div id="employee-results" class="results"></div>
      </div>
    </main>

    <!-- ===================== واجهة المدير ===================== -->
    <main id="manager-view" class="view hidden">
      <div class="container">
        <nav class="tabs">
          <button class="tab active" data-tab="clients">العملاء</button>
          <button class="tab" data-tab="daily">المبيعات اليومية</button>
          <button class="tab" data-tab="monthly">المبيعات الشهرية</button>
          <button class="tab" data-tab="statement">كشف الحسابات</button>
        </nav>

        <div id="tab-clients" class="tab-panel active"></div>
        <div id="tab-daily" class="tab-panel"></div>
        <div id="tab-monthly" class="tab-panel"></div>
        <div id="tab-statement" class="tab-panel"></div>
      </div>
    </main>

    <!-- ===================== صفحة ملف العميل ===================== -->
    <main id="client-view" class="view hidden">
      <div class="container">
        <button id="client-back" class="btn btn-outline btn-back">↩ العودة إلى قائمة العملاء</button>
        <div id="client-content"></div>
      </div>
    </main>
  </div>

  <!-- ===================== نافذة منبثقة عامة ===================== -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="modal-close" aria-label="إغلاق">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- تنبيه صغير -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
